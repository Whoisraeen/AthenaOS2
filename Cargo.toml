[workspace]
members = ["crates/athena-core", "crates/athena-memory", "crates/athena-sim", "kernel"]
default-members = ["crates/athena-core", "crates/athena-memory", "crates/athena-sim"]
resolver = "3"

[workspace.package]
edition = "2024"
rust-version = "1.85"
version = "0.1.0"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
undocumented_unsafe_blocks = "deny"

[profile.release]
panic = "abort"
lto = true
codegen-units = 1

